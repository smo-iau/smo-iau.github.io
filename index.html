/* Layout: a welcome screen like the club letterhead (cream page, logo, pattern band at the foot), then a drill-down: field → science → branch, each branch holding its guests. Brand is single-look (cream / green / gold) in both themes. */
:root{
  --cream:#ECE8DC; --paper:#F6F3EB; --green:#033024; --green-2:#0B4535; --gold:#D3B68A; --gold-ink:#7A5C2E;
  --ink:#033024; --muted:#4F6359; --line:#D3CAB6; --err:#9B2C1F;
  --display:"Mada Black","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}

.mark{display:inline-block;background:linear-gradient(transparent 40%,var(--gold) 40%,var(--gold) 92%,transparent 92%);padding-inline:.15em}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1.3;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.demo{background:var(--gold);color:var(--green);font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
.btn{border:0;border-radius:14px;padding:12px 24px;font-weight:600;background:var(--green);color:var(--cream);transition:background .15s,transform .15s}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:rgba(3,48,36,.06)}

/* Welcome */
#welcome{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
#welcome .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding-block:48px 24px}
#welcome .logo{width:clamp(130px,34vw,190px)}
#welcome h1{font-size:clamp(32px,7.6vw,56px)}
#welcome p{margin:0;color:var(--muted);font-size:17px;max-width:32ch}
#welcome .btn{font-size:18px;padding:14px 48px}
@media (prefers-reduced-motion:no-preference){
  #welcome .logo,#welcome h1,#welcome p,#welcome .btn{animation:rise .7s both}
  #welcome h1{animation-delay:.12s}#welcome p{animation-delay:.22s}#welcome .btn{animation-delay:.32s}
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
}

/* App shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .home-link{background:none;border:0;padding:0;display:flex}
.top img{width:52px}
.recent-btn{background:var(--gold);color:var(--green);border:0;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.recent-btn[aria-current="page"]{box-shadow:0 0 0 2px var(--green)}
.recent-item{display:grid;gap:2px;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;transition:border-color .15s}
.recent-item:hover{border-color:var(--green)}
.recent-item .n{font-weight:600;font-size:17px}
.recent-item .s{font-size:14px;color:var(--muted)}
.recent-item .p{font-size:13px;font-weight:600;color:var(--gold-ink)}
.recent-item .d{font-size:12px;color:var(--muted)}
.top nav{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top nav button{background:none;border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap}
@media (max-width:480px){.recent-btn{font-size:13px;padding:5px 9px}.top .wrap{gap:6px}.top img{width:38px}.top nav{gap:4px;flex-wrap:nowrap}.top nav button{padding:5px 8px;font-size:13px}.top .long{display:none}}
.top nav button:hover{border-color:var(--line)}
.top nav button[aria-current="page"]{border-color:var(--green)}
.top nav .quick{background:var(--green);color:var(--cream)}
.top nav .quick:hover{background:var(--green-2)}
main{padding-block:24px 48px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);margin-bottom:10px}
.crumbs button{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.head{display:grid;gap:4px;margin-bottom:22px}
.head h2{font-size:clamp(26px,6vw,38px)}
.head p{margin:0;color:var(--muted)}

/* Field choice */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field-card{position:relative;overflow:hidden;text-align:right;border:0;border-radius:22px;padding:28px 24px 96px;background:var(--green);color:var(--cream);display:grid;gap:6px;transition:transform .2s}
.field-card:nth-child(2){background:var(--gold);color:var(--green)}
.field-card:hover{transform:translateY(-3px)}

.minor{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.minor{grid-template-columns:1fr}}
.minor button{display:grid;gap:2px;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px 22px;transition:border-color .15s}
.minor button:hover{border-color:var(--green)}
.minor b{font-family:var(--display);font-weight:900;font-size:22px}
.minor span{font-size:14px;color:var(--muted)}

/* Lists */
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;transition:border-color .15s}
.item:hover{border-color:var(--green)}
.item .t{flex:1;min-width:0;font-weight:600;font-size:17px}
.count{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--cream);color:var(--muted);white-space:nowrap}
.count.has{background:var(--green);color:var(--cream)}
.chev{color:var(--gold-ink);font-size:20px;line-height:1}
.branch{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.branch>button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:14px 18px;text-align:right}
.branch>button .t{flex:1;min-width:0;font-weight:600;font-size:17px}
.branch .body{border-top:1px solid var(--line);padding:12px 18px 16px;display:grid;gap:10px}
.guests{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guests li{display:grid;gap:0;padding-inline-start:14px;border-inline-start:3px solid var(--gold)}
.guests .n{font-weight:600}
.guests .s{font-size:14px;color:var(--muted)}
.guests .pending{font-size:12px;color:var(--gold-ink);font-weight:600}
.empty{color:var(--muted);font-size:15px;margin:0}
.add-here{justify-self:start;background:none;border:1.5px dashed var(--green);border-radius:12px;padding:6px 14px;font-weight:600;font-size:14px}

/* Forms */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px clamp(16px,4vw,32px);display:grid;gap:18px;max-width:560px}
.f{display:grid;gap:6px;min-width:0}
label{font-weight:600;font-size:15px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:48px}
input:focus,select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(211,182,138,.55)}
.contact{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.contact legend{font-weight:600;font-size:15px;padding:0;margin-bottom:6px}
.contact-row{display:grid;grid-template-columns:minmax(130px,.8fr) 1.6fr;gap:8px}
@media (max-width:420px){.contact-row{grid-template-columns:1fr}}
.host{border-top:1px solid var(--line);padding-top:16px}
.where{background:var(--cream);border-radius:12px;padding:10px 14px;font-size:15px}
.where b{font-weight:600}
.error{font-size:13px;color:var(--err)}
.error:empty{display:none}
.invalid{border-color:var(--err)!important}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;inset:auto 0 calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--green);color:var(--cream);border-radius:14px;padding:12px 20px;font-weight:600;z-index:20;box-shadow:0 8px 24px rgba(3,48,36,.25)}

/* Calendar */
.cal-pages{display:grid;gap:16px}
.cal-pages img{width:100%;border-radius:16px;border:1px solid var(--line);background:#fff}
.cal-empty{display:grid;justify-items:center;text-align:center;gap:12px;background:var(--paper);border:1px dashed var(--gold-ink);border-radius:20px;padding:40px 20px}
.cal-empty .big{font-family:var(--display);font-size:28px}
footer{text-align:center;font-size:13px;color:var(--muted);padding-block:8px 0}
</style>

      <button class="recent-btn" type="button" data-go="recent" data-nav="recent">المضاف حديثًا</button>
      <nav>
        <button type="button" data-go="home" data-nav="home">العلوم</button>
        <button type="button" data-go="calendar" data-nav="calendar">التقويم<span class="long"> الأكاديمي</span></button>
        <button type="button" class="quick" data-go="quick" data-nav="quick">إضافة سريعة</button>
      </nav>
    </div>
  </div>
  <main class="wrap" id="view" aria-live="polite"></main>
  <footer class="wrap">نادي سمو · كلية الشريعة والقانون</footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* المحتوى القابل للتحديث في مجلد data:
   data/specialties.json  قائمة العلوم والفروع
   data/site.json         الإعدادات والتقويم الأكاديمي */
let DATA = {fields: []}, SITE = {}, MAIN = [], MINOR = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const findField = id => DATA.fields.find(f => f.id === id);
const findCat = (f, id) => f?.categories.find(c => c.id === id);

/* ----- Store: Google Sheet in production, this browser in preview ----- */
const LS = "sumow-guests";
let guests = [];
const Store = {
  async load(){
    if (SITE.endpoint) {
      const r = await fetch(SITE.endpoint + "?action=list");
      const j = await r.json();
      return (j.guests || []).map(placeGuest).filter(g => g.category_id);
    }
    try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; }
  },
  async add(rec){
    if (SITE.endpoint) {
      await fetch(SITE.endpoint, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(rec) });
      return;
    }
    guests.push({...rec, pending:true, date:new Date().toISOString()});
    try { localStorage.setItem(LS, JSON.stringify(guests)); } catch (e) {}
  }
};
// The sheet stores Arabic names; match them back to the site's categories and branches.
const norm = t => String(t || "").replace(/[\s\u0640]+/g, " ").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").trim();
function placeGuest(g){
  const f = DATA.fields.find(x => norm(x.name) === norm(g.field));
  const pool = f ? f.categories : DATA.fields.flatMap(x => x.categories);
  const c = pool.find(x => norm(x.name) === norm(g.category));
  const b = c?.branches.find(x => norm(x.name) === norm(g.branch));
  return {...g, category_id: c?.id || "", branch_id: b?.id || ""};
}
const shown = () => guests.filter(g => g.category_id);
const inCat = id => shown().filter(g => g.category_id === id);
const inBranch = id => shown().filter(g => (g.branch_id || "") === id);
const inField = f => shown().filter(g => g.category_id?.startsWith(f.id + "."));
const countBadge = n => `<span class="count ${n ? "has" : ""}">${n ? n + " ضيف" : "لا ضيوف بعد"}</span>`;

/* ----- Router ----- */
let state = {view:"home"};
function go(view, extra = {}){ state = {view, ...extra}; render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  go(b.dataset.go, {field: b.dataset.field, cat: b.dataset.cat, branch: b.dataset.branch});
});
$("enter").onclick = () => { $("welcome").hidden = true; $("app").hidden = false; go(location.hash === "#calendar" ? "calendar" : "home"); };

function crumbs(parts){
  return `<div class="crumbs">` + parts.map((p, i) => i < parts.length - 1
    ? `<button type="button" ${p.go}>${esc(p.t)}</button><span aria-hidden="true">‹</span>`
    : `<span>${esc(p.t)}</span>`).join("") + `</div>`;
}

function render(){
  document.querySelectorAll("[data-nav]").forEach(b => b.toggleAttribute("aria-current", false));
  const navKey = ["calendar","quick","recent"].includes(state.view) ? state.view : "home";
  document.querySelector(`[data-nav="${navKey}"]`)?.setAttribute("aria-current", "page");
  const v = $("view");
  if (state.view === "home") v.innerHTML = viewHome();
  else if (state.view === "field") v.innerHTML = viewField(findField(state.field));
  else if (state.view === "cat") v.innerHTML = viewCat(findField(state.field), state.cat);
  else if (state.view === "add") { v.innerHTML = viewAdd(); bindAdd(); }
  else if (state.view === "quick") { v.innerHTML = viewQuick(); bindQuick(); }
  else if (state.view === "calendar") v.innerHTML = viewCalendar();
  else if (state.view === "recent") v.innerHTML = viewRecent();
}

function viewRecent(){
  const list = shown().map((g, i) => ({g, i})).sort((a, b) => (Date.parse(b.g.date) || b.i) - (Date.parse(a.g.date) || a.i)).slice(0, 30);
  const fmt = d => { const t = Date.parse(d); return t ? new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {day:"numeric", month:"long", year:"numeric"}).format(t) : ""; };
  const body = !list.length
    ? `<div class="cal-empty"><span class="big">لا إضافات بعد</span><p class="empty">يظهر هنا آخر الضيوف بعد اعتمادهم من إدارة النادي.</p></div>`
    : `<div class="list">${list.map(({g}) => {
        const f = DATA.fields.find(x => g.category_id.startsWith(x.id + "."));
        const c = findCat(f, g.category_id), b = c?.branches.find(x => x.id === g.branch_id);
        return `<button class="recent-item" type="button" data-go="cat" data-field="${f.id}" data-cat="${c.id}">
          <span class="n">${esc(g.name)}</span>${g.title ? `<span class="s">${esc(g.title)}</span>` : ""}${g.topic ? `<span class="s">«${esc(g.topic)}»</span>` : ""}
          <span class="p">${esc(f.name)} ‹ ${esc(c.name)}${b ? " ‹ " + esc(b.name) : ""}</span>
          ${fmt(g.date) ? `<span class="d">${fmt(g.date)}</span>` : ""}${g.pending ? `<span class="d">بانتظار اعتماد النادي</span>` : ""}
        </button>`; }).join("")}</div>`;
  return `<div class="head"><h2>المضاف <span class="mark">حديثًا</span></h2><p>آخر الضيوف المضافين إلى الموقع، والأحدث أولًا.</p></div>${body}`;
}

function viewHome(){
  return `<div class="head"><h2>اختر <span class="mark">العلم</span></h2><p>ادخل إلى علوم الشريعة أو القانون، ثم اختر الفرع لترى ضيوفه.</p></div>
  <div class="fields">${MAIN.map(f => `
    <button class="field-card" type="button" data-go="field" data-field="${f.id}">
      <h3>${f.id === "sharia" ? "علوم الشريعة" : "القانون"}</h3>
      <span class="meta">${f.categories.length} ${f.id === "sharia" ? "علوم" : "أقسام"} · ${inField(f).length} ضيف</span>
    </button>`).join("")}</div>
  ${MINOR.length ? `<div class="minor">${MINOR.map(f => `<button type="button" data-go="field" data-field="${f.id}"><b>${esc(f.name)}</b><span>${f.categories.map(c => c.name).join("، ")}</span></button>`).join("")}</div>` : ""}`;
}

function viewField(f){
  if (!f) return viewHome();
  return crumbs([{t:"العلوم", go:'data-go="home"'}, {t:f.name}]) +
  `<div class="head"><h2>${esc(f.name)}</h2><p>اختر ${f.id === "law" ? "القسم" : "العلم"} لترى فروعه وضيوفه.</p></div>
  <div class="list">${f.categories.map(c => `
    <button class="item" type="button" data-go="cat" data-field="${f.id}" data-cat="${c.id}">
      <span class="t">${esc(c.name)}</span>${countBadge(inCat(c.id).length)}<span class="chev" aria-hidden="true">‹</span>
    </button>`).join("")}</div>`;
}

function viewCat(f, catId){
  const c = findCat(f, catId); if (!c) return viewField(f);
  const general = inBranch("").filter(g => g.category_id === c.id);
  const rows = [{id:"", name:c.branches.length ? "عام في " + c.name : "ضيوف " + c.name, list: general}, ...c.branches.map(b => ({id:b.id, name:b.name, list:inBranch(b.id)}))]
    .filter(r => r.id || r.list.length || !c.branches.length);
  return crumbs([{t:"العلوم", go:'data-go="home"'}, {t:f.name, go:`data-go="field" data-field="${f.id}"`}, {t:c.name}]) +
  `<div class="head"><h2>${esc(c.name)}</h2><p>افتح الفرع لترى ضيوفه، أو أضف ضيفًا إليه.</p></div>
  <div class="list">${rows.map(r => `
    <div class="branch">
      <button type="button" aria-expanded="${r.list.length ? "true" : "false"}" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')!=='true'); this.nextElementSibling.hidden = this.getAttribute('aria-expanded')!=='true'">
        <span class="t">${esc(r.name)}</span>${countBadge(r.list.length)}
      </button>
      <div class="body" ${r.list.length ? "" : "hidden"}>
        ${r.list.length ? `<ul class="guests">${r.list.map(g => `<li><span class="n">${esc(g.name)}</span>${g.title ? `<span class="s">${esc(g.title)}</span>` : ""}${g.topic ? `<span class="s">«${esc(g.topic)}»</span>` : ""}${g.pending ? `<span class="pending">بانتظار اعتماد النادي</span>` : ""}</li>`).join("")}</ul>` : `<p class="empty">لم يُضف ضيف في هذا الفرع بعد.</p>`}
        <button class="add-here" type="button" data-go="add" data-field="${f.id}" data-cat="${c.id}" data-branch="${r.id}">+ أضف ضيفًا هنا</button>
      </div>
    </div>`).join("")}</div>`;
}

/* ----- Add to a branch ----- */
function viewAdd(){
  const f = findField(state.field), c = findCat(f, state.cat);
  const b = c?.branches.find(x => x.id === state.branch);
  return crumbs([{t:"العلوم", go:'data-go="home"'}, {t:f.name, go:`data-go="field" data-field="${f.id}"`}, {t:c.name, go:`data-go="cat" data-field="${f.id}" data-cat="${c.id}"`}, {t:"إضافة ضيف"}]) +
  `<div class="head"><h2>إضافة <span class="mark">ضيف</span></h2></div>
  <form class="sheet" id="add-form" novalidate>
    <div class="where">يُضاف في: <b>${esc(f.name)} ‹ ${esc(c.name)}${b ? " ‹ " + esc(b.name) : ""}</b></div>
    ${nameFields()}
    ${hostField()}
    <button class="btn" type="submit">إضافة الضيف</button>
    <div class="error" id="e-submit" role="alert"></div>
    <p class="note">يظهر الاسم في الموقع بعد اعتماده من إدارة النادي.</p>
  </form>`;
}
function hostField(){
  return `    <div class="f host"><label for="g-host">اسم المضيف <span class="opt">(أنت، من يضيف هذا الضيف)</span></label>
      <input id="g-host" autocomplete="name" maxlength="80" placeholder="اكتب اسمك">
      <div class="error" id="e-host"></div></div>`;
}
function nameFields(){
  return `<div class="f"><label for="g-name">اسم الضيف</label>
      <input id="g-name" autocomplete="off" maxlength="120" placeholder="مثال: د. عبدالله بن محمد العتيبي">
      <div class="error" id="e-name"></div></div>
    <div class="f"><label for="g-title">صفته أو جهته <span class="opt">(اختياري)</span></label>
      <input id="g-title" maxlength="120" placeholder="مثال: أستاذ الفقه المشارك، جامعة الإمام عبدالرحمن بن فيصل"></div>
    <div class="f"><label for="g-topic">عنوان اللقاء أو المحاضرة <span class="opt">(اختياري)</span></label>
      <input id="g-topic" maxlength="150" placeholder="مثال: نظام المعاملات المدنية: قراءة فقهية"></div>
    <fieldset class="contact">
      <legend>طريقة التواصل مع الضيف <span class="opt">(تصل للنادي فقط ولا تظهر في الموقع)</span></legend>
      <div class="contact-row">
        <select id="c-method" aria-label="وسيلة التواصل">
          <option value="">الوسيلة</option>
          <option>واتساب</option><option>اتصال</option><option>البريد الإلكتروني</option>
          <option>حساب X</option><option>لينكدإن</option><option>عن طريق شخص يعرفه</option><option>أخرى</option>
        </select>
        <input id="c-value" maxlength="150" placeholder="الرقم أو الحساب أو اسم الوسيط">
      </div>
      <div class="error" id="e-contact"></div>
    </fieldset>
    <div class="hp" aria-hidden="true"><label for="g-web">اتركه فارغًا</label><input id="g-web" tabindex="-1" autocomplete="off"></div>`;
}
function readName(){
  const name = $("g-name").value.trim().replace(/\s+/g, " ");
  $("e-name").textContent = name.length >= 3 ? "" : "اكتب اسم الضيف.";
  $("g-name").classList.toggle("invalid", name.length < 3);
  const host = $("g-host").value.trim().replace(/\s+/g, " ");
  $("e-host").textContent = host.length >= 2 ? "" : "اكتب اسمك حتى يعرف النادي من أضاف الضيف.";
  $("g-host").classList.toggle("invalid", host.length < 2);
  if (host.length >= 2) { try { localStorage.setItem("sumow-host", host); } catch (e) {} }
  const method = $("c-method").value, contact = $("c-value").value.trim();
  const cErr = method && !contact ? "اكتب الرقم أو الحساب." : !method && contact ? "اختر وسيلة التواصل." : "";
  $("e-contact").textContent = cErr;
  $("c-method").classList.toggle("invalid", !method && !!contact);
  $("c-value").classList.toggle("invalid", !!method && !contact);
  return name.length >= 3 && !cErr && host.length >= 2 ? {name, host, title: $("g-title").value.trim(), topic: $("g-topic").value.trim(), contact_method: method, contact, website: $("g-web").value} : null;
}
async function save(rec, form, msg){
  const btn = form.querySelector("[type=submit]"); btn.disabled = true;
  $("e-submit").textContent = "";
  try { await Store.add(rec); toast(msg); return true; }
  catch (e) { $("e-submit").textContent = "لم تصل الإضافة، تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى."; return false; }
  finally { btn.disabled = false; }
}
function bindAdd(){
  try { $("g-host").value = localStorage.getItem("sumow-host") || ""; } catch (e) {}
  $("g-name").focus({preventScroll:true});
  $("add-form").addEventListener("submit", async e => {
    e.preventDefault();
    const n = readName(); if (!n) return;
    const f = findField(state.field), c = findCat(f, state.cat), b = c.branches.find(x => x.id === state.branch);
    const ok = await save({...n, kind:"full", field:f.name, category:c.name, branch:b?.name || "", category_id:c.id, branch_id:b?.id || ""},
      e.target, "أُضيف «" + n.name + "»، وسيظهر بعد اعتماد النادي.");
    if (ok) go("cat", {field:f.id, cat:c.id});
  });
}

/* ----- Quick add ----- */
function viewQuick(){
  return `<div class="head"><h2>إضافة <span class="mark">سريعة</span></h2><p>اكتب اسم الضيف وعلمه فقط، وفريق النادي يضعه في الفرع المناسب.</p></div>
  <form class="sheet" id="quick-form" novalidate>
    ${nameFields()}
    <div class="f"><label for="q-field">المجال</label>
      <select id="q-field"><option value="">اختر</option>${DATA.fields.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select>
      <div class="error" id="e-field"></div></div>
    <div class="f"><label for="q-sci">العلم أو التخصص</label>
      <input id="q-sci" list="q-list" maxlength="120" placeholder="مثال: أصول الفقه، القانون التجاري">
      <datalist id="q-list"></datalist>
      <div class="error" id="e-sci"></div></div>
    ${hostField()}
    <button class="btn" type="submit">إرسال</button>
    <div class="error" id="e-submit" role="alert"></div>
  </form>`;
}
function bindQuick(){
  try { $("g-host").value = localStorage.getItem("sumow-host") || ""; } catch (e) {}
  $("g-name").focus({preventScroll:true});
  $("q-field").addEventListener("change", () => {
    const f = findField($("q-field").value);
    $("q-list").innerHTML = (f?.categories || []).map(c => `<option value="${esc(c.name)}"></option>`).join("");
  });
  $("quick-form").addEventListener("submit", async e => {
    e.preventDefault();
    const n = readName();
    const f = findField($("q-field").value), sci = $("q-sci").value.trim();
    $("e-field").textContent = f ? "" : "اختر المجال.";
    $("e-sci").textContent = sci ? "" : "اكتب العلم أو التخصص.";
    if (!n || !f || !sci) return;
    const ok = await save({...n, kind:"quick", field:f.name, category:sci, branch:"", category_id:"", branch_id:""},
      e.target, "وصل «" + n.name + "»، وسيصنّفه فريق النادي.");
    if (ok) { const h = $("g-host").value; e.target.reset(); $("g-host").value = h; $("g-name").focus(); }
  });
}

/* ----- Academic calendar ----- */
function viewCalendar(){
  const c = SITE.calendar || {};
  const pages = c.pages || [];
  const body = !pages.length
    ? `<div class="cal-empty"><span class="big">قريبًا</span><p class="empty">يُضاف هنا التقويم الأكاديمي حال اعتماده.</p></div>`
    : `${c.pdf ? `<p><a class="btn ghost" href="${esc(c.pdf)}" target="_blank" rel="noopener">فتح الملف الأصلي (PDF)</a></p>` : ""}
       <div class="cal-pages">${pages.map((p, i) => `<img src="${esc(p)}" alt="${esc(c.title || "التقويم الأكاديمي")}، الصفحة ${i + 1}" loading="lazy">`).join("")}</div>`;
  return `<div class="head"><h2>التقويم <span class="mark">الأكاديمي</span></h2><p>${esc(c.title || "مواعيد الفصول الدراسية والإجازات والاختبارات.")}</p></div>${body}`;
}

let tt;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); }

async function boot(){
  try {
    [DATA, SITE] = await Promise.all([fetch("data/specialties.json").then(r => r.json()), fetch("data/site.json").then(r => r.json())]);
  } catch (e) { $("enter").textContent = "تعذّر تحميل المحتوى، حدّث الصفحة"; return; }
  MAIN = DATA.fields.filter(f => f.id === "sharia" || f.id === "law");
  MINOR = DATA.fields.filter(f => f.id !== "sharia" && f.id !== "law" && f.categories.length);
  $("demo-bar").hidden = !!SITE.endpoint;
  if (!$("app").hidden) render();
  try { guests = await Store.load(); } catch (e) {}
  if (!$("app").hidden) render();
}
boot();
</script>
